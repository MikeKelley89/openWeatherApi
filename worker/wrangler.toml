name = "openweather-proxy"
main = "src/index.js"
compatibility_date = "2026-10-27"
workers_dev = true

# Approximate limit: 10 requests per minute per client IP, per Cloudflare location.
# Use a unique numeric namespace ID for this account.
[[ratelimits]]
name = "WEATHER_RATE_LIMITER"
namespace_id = "82746103"

[ratelimits.simple]
limit = 10
period = 60
