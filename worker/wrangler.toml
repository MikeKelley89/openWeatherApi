name = "openweather-proxy"
main = "src/index.js"
compatibility_date = "2026-10-27"
workers_dev = true

# Approximate limit: 10 requests per minute per client IP, per Cloudflare location.
# Change namespace_id to a unique positive integer for your Cloudflare account.
[[ratelimits]]
name = "WEATHER_RATE_LIMITER"
namespace_id = "2746101"

[ratelimits.simple]
limit = 10
period = 60
